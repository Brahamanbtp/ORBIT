name: orbit-env
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pyyaml>=6.0
  - matplotlib>=3.7
  - pytest>=7.0
  - pip
  - pip:
      # lz4 and zstandard are installed via pip because conda-forge versions may lag behind.
      - lz4>=4.0.0
      - zstandard>=0.20.0
